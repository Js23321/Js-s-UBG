<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Minecraft Case Sim</title>

  <base href="https://raw.githubusercontent.com/Slammpreal/slammpgames/main/minecraft-case-sim/">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }
  </style>
</head>

<body>
  <script>
    fetch("https://raw.githubusercontent.com/Slammpreal/slammpgames/main/minecraft-case-sim/index.html")
      .then(r => r.text())
      .then(html => {
        document.open();
        document.write(html);
        document.close();
      });
  </script>
</body>
</html>
